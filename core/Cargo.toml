[package]
name = "fastgraph_core"
version = "0.1.0"
edition = "2021"
description = "Layout engine for the Fast Graph Obsidian plugin (compiled to WebAssembly)"
license = "0BSD"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
